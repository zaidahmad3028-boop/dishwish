<!-- Supabase → Authentication → Emails → Templates → "Confirm sign up".
     Subject: Confirm your DishWish account -->
<div style="margin:0;padding:32px 16px;background:#fff7ed;font-family:Arial,Helvetica,sans-serif;color:#292524">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:20px;padding:32px;border:1px solid #fed7aa">
    <p style="margin:0 0 4px;font-size:22px;font-weight:800;color:#be123c">DishWish</p>
    <h1 style="margin:16px 0 8px;font-size:22px;color:#1c1917">Confirm your email</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.6">
      Thanks for signing up! Tap the button below to confirm <strong>{{ .Email }}</strong> and open your kitchen.
    </p>
    <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email"
       style="display:inline-block;background:#e11d48;color:#ffffff;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:999px">
      Confirm my email
    </a>
    <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#78716c">
      This link works once and expires in 1 hour. If you didn’t create a DishWish account, you can ignore this email.
    </p>
  </div>
</div>
